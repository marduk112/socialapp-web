name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The e2e project has its own tsconfig; the e2e suite itself needs the backend (see the SocialApp repository).
      - name: Type-check the e2e sources
        run: npx tsc -p e2e/tsconfig.json
      - name: Production build
        run: npm run build
